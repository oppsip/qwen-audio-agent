server {
    listen 80;
    listen [::]:80;
    server_name audio.zhonglele.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 4433 ssl;
    listen [::]:4433 ssl;
    server_name audio.zhonglele.top;

    ssl_certificate /etc/letsencrypt/live/audio.zhonglele.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audio.zhonglele.top/privkey.pem;

    location / {
        proxy_pass http://172.23.0.1:18888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
